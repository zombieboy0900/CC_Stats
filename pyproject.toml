[project]
name = "cc-stats"
version = "0.1.0"
description = "Corpus callosotomy seizure-type analysis: cohort loading, ILAE taxonomy, custom seizure-type groups, and the shared R-ready dataset."
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# src layout. The package is deliberately flat inside src/cc_stats/. See
# src/cc_stats/__init__.py for the layer map.
[tool.setuptools.packages.find]
where = ["src"]
